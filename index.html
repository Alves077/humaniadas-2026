<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humaniadas 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-inner">
    <div class="loading-mark">H</div>
    <div class="loading-title">Humaniadas 2026</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    <div class="loading-label">Carregando resultados…</div>
  </div>
</div>

<!-- Modal de login admin -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-icon">🔐</div>
    <h2 class="modal-title">Acesso Admin</h2>
    <p class="modal-sub">Digite a senha para editar os resultados</p>
    <input
      type="password"
      id="adminPasswordInput"
      class="modal-input"
      placeholder="Senha"
      onkeydown="if(event.key==='Enter') submitAdminLogin()"
    >
    <div class="modal-error" id="adminError"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeAdminModal()">Cancelar</button>
      <button class="modal-btn confirm" onclick="submitAdminLogin()">Entrar</button>
    </div>
  </div>
</div>

<!-- Header -->
<header class="top">
  <div class="top-inner">
    <div class="brand" onclick="showView('geral')" style="cursor:pointer;">
      <span class="brand-mark">H</span>
      <div class="brand-text">
        <span class="brand-title">Humaniadas</span>
        <span class="brand-year">2026</span>
      </div>
    </div>

    <nav class="tabs" id="mainTabs">
      <button class="tab active" data-view="geral">🏆 Geral</button>
      <button class="tab" data-view="chaveamentos">🎯 Chaveamentos</button>
      <button class="tab" data-view="cheerleading">📣 Cheerleading</button>
    </nav>

    <div class="header-right">
      <div class="sync-status" id="syncStatus"></div>
      <button class="admin-toggle" id="adminToggleBtn" onclick="handleAdminToggle()">
        <span id="adminToggleIcon">🔒</span>
        <span id="adminToggleLabel">Admin</span>
      </button>
      <button class="burger-btn" id="burgerBtn" onclick="toggleMobileMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile nav drawer -->
  <div class="mobile-nav" id="mobileNav">
    <button class="mobile-tab" data-view="geral" onclick="mobileNavTo('geral')">🏆 Geral</button>
    <button class="mobile-tab" data-view="chaveamentos" onclick="mobileNavTo('chaveamentos')">🎯 Chaveamentos</button>
    <button class="mobile-tab" data-view="cheerleading" onclick="mobileNavTo('cheerleading')">📣 Cheerleading</button>
  </div>
</header>

<div class="shell">

  <!-- GERAL -->
  <section class="view active" id="view-geral">
    <div class="view-header">
      <h1 class="view-title">Classificação Geral</h1>
      <div class="progress-pill" id="progressPill"></div>
    </div>
    <div class="podium-row" id="podiumRow"></div>
    <div class="table-wrap">
      <table class="standings">
        <thead><tr id="standingsHead"></tr></thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
  </section>

  <!-- EXPORT CANVAS (hidden, used for image generation) -->
  <div id="exportCanvas" style="position:fixed;left:-9999px;top:0;width:640px;background:#080c10;padding:32px;font-family:Inter,system-ui,sans-serif;"></div>

  <!-- CHAVEAMENTOS HUB -->
  <section class="view" id="view-chaveamentos">
    <div class="view-header">
      <div>
        <h1 class="view-title">Chaveamentos</h1>
        <p class="view-sub">Selecione um esporte para ver os resultados</p>
      </div>
      <div class="progress-pill" id="sportsProgressPill"></div>
    </div>
    <div class="sport-grid" id="sportGrid"></div>
  </section>

  <!-- BRACKET -->
  <section class="view" id="view-bracket">
    <div class="view-header">
      <button class="back-btn" onclick="showView('chaveamentos')">← Chaveamentos</button>
      <div class="bracket-title-block">
        <span id="bracketIcon"></span>
        <h1 class="view-title" id="bracketTitle">—</h1>
      </div>
      <div></div>
    </div>
    <div id="bracketR1"></div>
    <div class="bracket-scroll">
      <div class="bracket" id="bracketTree"></div>
    </div>
    <div class="mini-standings-wrap">
      <h4 class="section-label">Colocação final</h4>
      <div id="bracketStandings"></div>
    </div>
  </section>

  <!-- CHEERLEADING -->
  <section class="view" id="view-cheerleading">
    <div class="view-header">
      <div>
        <h1 class="view-title">📣 Cheerleading</h1>
        <p class="view-sub">Colocação final de cada equipe</p>
      </div>
    </div>
    <div class="cheer-container">
      <div class="cheer-grid" id="cheerGrid"></div>
      <div class="cheer-warn" id="cheerWarn"></div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/state.js"></script>
<script src="js/admin.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
